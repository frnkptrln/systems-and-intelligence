name: Deploy Book to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-24.04  # the image these checks were verified on; ubuntu-latest becomes 26.04 from 19 Oct 2026
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: 3.x
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: pip install -r requirements-docs.txt
      - run: npm install --no-save --no-package-lock katex@0.18.1
      - name: Documentation navigation validation
        run: python lab/tools/validate_nav.py
      - name: Mathematical Markdown validation
        run: python lab/tools/validate_math.py
      # Built before the site so MkDocs picks the PDF up as a page asset and
      # the download link on the paper always resolves to a current file.
      - name: Build the paper PDF
        run: python lab/tools/build_paper_pdf.py
      - run: mkdocs build --strict
      - name: KaTeX rendering validation
        run: node lab/tools/validate_katex.js site
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: ./site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-24.04  # the image these checks were verified on; ubuntu-latest becomes 26.04 from 19 Oct 2026
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
