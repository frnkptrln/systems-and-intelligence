name: CI

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install -r requirements-dev.txt
      - name: Unit tests + benchmark headline regression
        run: pytest tests/ -q
      - name: Held-out == ceiling invariant (target-conditioning detector)
        run: pytest tests/test_referee_invariant.py -q
      - name: Internal link validation
        run: python lab/tools/validate_links.py
      - name: Index completeness and link-label validation
        run: python lab/tools/validate_indexes.py
      - name: Repository freshness and internal-drift audit
        run: python lab/tools/audit_repository_freshness.py --strict

  ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: pip install -r requirements-dev.txt
      - run: pip install --index-url https://download.pytorch.org/whl/cpu -r requirements-ml.txt
      - name: Require PyTorch
        run: python -c "import torch; print(torch.__version__)"
      - name: Optional PyTorch model tests
        run: pytest tests/test_ctm_nlm.py tests/test_trace_to_generator_small.py -q

  docs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pip install -r requirements-docs.txt
      - run: npm install --no-save --no-package-lock katex@0.18.1
      - name: Documentation navigation validation
        run: python lab/tools/validate_nav.py
      - name: Mathematical Markdown validation
        run: python lab/tools/validate_math.py
      - name: Build the paper PDF
        run: python lab/tools/build_paper_pdf.py
      - name: Strict documentation build
        run: mkdocs build --strict
      - name: KaTeX rendering validation
        run: node lab/tools/validate_katex.js site
