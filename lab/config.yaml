USE_MOCK_LLM: true

# Provider configuration for the Agentic Identity Suite.
# Mock mode is the default. Real mode is scaffolded but not wired into the
# existing experiments yet — it is infrastructure for the eventual empirical
# step. See lab/providers/README.md for the architecture and reviewed API notes.
llm:
  # provider: 'mock' (default, deterministic, no API calls) | 'anthropic'
  provider: mock
  anthropic:
    # Repository default target. Review the provider contract when changing it.
    model: claude-sonnet-5
    # Value passed as max_tokens to the Messages API request.
    max_tokens: 4096
    # API key is read from this environment variable. Real mode fails fast
    # if the variable is unset; mock mode does not read it.
    api_key_env: ANTHROPIC_API_KEY
    # API endpoint and version. Override only for an intentionally different
    # endpoint or proxy and record that change with the experiment.
    endpoint: https://api.anthropic.com/v1/messages
    api_version: "2023-06-01"
    timeout_seconds: 60

memory:
  layer2_trigger_sessions: 10
  layer3_trigger_sessions: 50

delta_coherence:
  threshold_low: 0.15
  threshold_high: 0.50
  threshold_consistency: 0.10
  window: 5

experiments:
  n_sessions_exp1: 100
  n_sessions_exp2_stable: 50
  n_sessions_exp2_perturbation: 10
  n_sessions_exp2_recovery: 30
  observer_window: 10

# Persistence scoring from instrumented component-activity traces.
# One empirical instrument among several. Used to compare a different
# observable with Δ-Kohärenz. See lab/metrics/persistence_scores.py.
persistence:
  # Experiment-local cutoff for the Chord/Arpeggio regime label. This is a
  # classifier parameter, not evidence of a physical phase transition.
  ip_c_threshold: 0.85
