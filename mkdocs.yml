site_name: "Systems & Intelligence"
site_description: "Essays, stories, working logs, and experiments on systems, intelligence, and the worlds we make."
site_author: "Frank Peterlein"
site_url: "https://frnkptrln.github.io/systems-and-intelligence"
repo_url: https://github.com/frnkptrln/systems-and-intelligence
repo_name: frnkptrln/systems-and-intelligence
edit_uri: blob/main/

docs_dir: 'docs'
hooks:
  - lab/tools/mkdocs_repo_links.py
exclude_docs: |
  # The repository is the whole body of work; the site publishes the part
  # that offers a readable encounter, including drafts with visible status. Everything
  # excluded here stays in the repository and stays linked: the
  # lab/tools/mkdocs_repo_links.py hook redirects any link that points at an
  # unpublished page to the file on GitHub, and docs/repository-map.md lists
  # the layers. Excluding is an editorial act, not a deletion.

  book/
  !book/09_from_rule_to_mind.md

  simulation-models/

  lab/
