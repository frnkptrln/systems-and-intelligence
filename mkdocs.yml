theme:
  name: material
  custom_dir: docs/overrides
  font:
    # Matches the foyer at frnkptrln.github.io, so the notebook reads as the
    # room behind that door rather than a separate site.
    text: Space Grotesk
    code: JetBrains Mono
  icon:
    repo: fontawesome/brands/github
    logo: material/square-outline
  palette:
    # Palette toggle for dark mode (default) — the foyer's own values
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: lime
      toggle:
        icon: material/circle-outline
        name: Switch to light mode

    # Palette toggle for light mode — the same palette on paper
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: lime
      toggle:
        icon: material/circle-slice-8
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.indexes
    - navigation.path
    - navigation.top
    - navigation.instant
    - navigation.instant.progress
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - header.autohide

extra_css:
  - stylesheets/extra.css
  - https://unpkg.com/katex@0.18.1/dist/katex.min.css

extra_javascript:
  - javascripts/katex.js
  - https://unpkg.com/katex@0.18.1/dist/katex.min.js
  - https://unpkg.com/katex@0.18.1/dist/contrib/auto-render.min.js

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.arithmatex:
      generic: true
  - pymdownx.betterem
  - pymdownx.caret
  - pymdownx.details
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.keys
  - pymdownx.smartsymbols
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.tilde

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/frnkptrln/systems-and-intelligence
      name: The repository behind this site
    - icon: material/door-open
      link: https://frnkptrln.github.io/
      name: Back to the foyer
  generator: false
